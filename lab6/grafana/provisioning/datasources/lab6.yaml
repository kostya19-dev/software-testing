apiVersion: 1

datasources:
  - name: Prometheus
    uid: lab6-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 1s

  - name: Jaeger
    uid: lab6-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
