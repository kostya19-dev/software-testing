name: Lab 5 - authentication BDD

on:
  push:
    paths:
      - '.github/workflows/lab5.yml'
      - 'lab5/**'
      - 'project/VitaLineClinic/**'
  pull_request:
    paths:
      - '.github/workflows/lab5.yml'
      - 'lab5/**'
      - 'project/VitaLineClinic/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: project/VitaLineClinic/go.mod
          cache-dependency-path: |
            project/VitaLineClinic/go.sum
            lab5/go.sum
      - name: Check API and BDD code
        run: |
          cd project/VitaLineClinic
          go vet ./internal/auth ./internal/delivery/http ./cmd/clinic
          go test ./internal/auth ./internal/delivery/http ./cmd/clinic
          cd ../../lab5
          make check

  e2e:
    permissions:
      actions: read
      contents: read
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read previous BDD results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow lab5.yml --branch "$GITHUB_REF_NAME" \
            --status completed --limit 20 --json number,databaseId,attempt \
            --jq ".[] | select(.number < $GITHUB_RUN_NUMBER) | [.number,.databaseId,.attempt] | @tsv" > "$RUNNER_TEMP/lab5-runs"
          while read -r number id attempt; do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "lab5-bdd-$id-$attempt" \
              --dir "$RUNNER_TEMP/lab5-history/$number" || echo "No BDD artifact for run $number"
          done < "$RUNNER_TEMP/lab5-runs"
      - name: Run isolated authentication scenarios
        id: bdd
        working-directory: lab5
        env:
          LAB5_TEST_PASSWORD: ${{ secrets.LAB5_TEST_PASSWORD }}
        run: make test
      - name: Upload Allure report
        id: report
        if: ${{ !cancelled() && steps.bdd.outputs.report == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.bdd.outputs.results }}/allure-report/index.html
          archive: false
          retention-days: 14
      - name: Link Allure report
        if: ${{ !cancelled() && steps.report.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: printf '[Открыть отчёт Allure](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload BDD results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab5-bdd-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lab5/results/*/bdd.log
            lab5/results/*/junit.xml
            lab5/results/*/cucumber.json
            lab5/results/*/cleanup.txt
          if-no-files-found: ignore
          retention-days: 14
