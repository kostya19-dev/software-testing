name: Lab 5 - authentication BDD

on:
  push:
    paths:
      - '.github/workflows/lab5.yml'
      - 'lab5/**'
      - 'project/VitaLineClinic/**'
  pull_request:
    paths:
      - '.github/workflows/lab5.yml'
      - 'lab5/**'
      - 'project/VitaLineClinic/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: project/VitaLineClinic/go.mod
          cache-dependency-path: |
            project/VitaLineClinic/go.sum
            lab5/go.sum
      - name: Check API and BDD code
        run: |
          cd project/VitaLineClinic
          go vet ./internal/auth ./internal/delivery/http ./cmd/clinic
          go test ./internal/auth ./internal/delivery/http ./cmd/clinic
          cd ../../lab5
          make check

  e2e:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      dashboard: ${{ steps.dashboard.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run isolated authentication scenarios
        id: bdd
        working-directory: lab5
        env:
          LAB5_TEST_PASSWORD: ${{ secrets.LAB5_TEST_PASSWORD }}
        run: make test
      - name: Prepare Grafana dashboard
        id: grafana
        if: ${{ !cancelled() && steps.bdd.outputs.results != '' }}
        working-directory: lab5
        env:
          RESULT_DIR: ${{ steps.bdd.outputs.results }}
        run: |
          if [ -s "$RESULT_DIR/junit.xml" ]; then
            python3 scripts/grafana_dashboard.py "$RESULT_DIR/junit.xml" "$RUNNER_TEMP/lab5-grafana"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Capture Grafana dashboard
        if: ${{ !cancelled() && steps.grafana.outputs.ready == 'true' }}
        working-directory: lab5
        run: |
          cd "$RUNNER_TEMP/lab5-grafana"
          trap 'docker compose down -v' EXIT
          docker compose up -d
          curl --retry 60 --retry-delay 2 --retry-all-errors --fail --silent http://127.0.0.1:3055/api/health > /dev/null
          python3 -m pip install --quiet playwright==1.56.0
          python3 "$GITHUB_WORKSPACE/lab5/scripts/grafana_capture.py" http://127.0.0.1:3055 grafana.png
      - name: Upload Grafana dashboard
        id: dashboard
        if: ${{ !cancelled() && steps.grafana.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: lab5-grafana-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab5-grafana/
          retention-days: 14
      - name: Upload BDD reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab5-bdd-${{ github.run_id }}-${{ github.run_attempt }}
          path: lab5/results/
          if-no-files-found: warn
          retention-days: 14

  grafana:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.outputs.dashboard != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/lab5') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.e2e.outputs.dashboard }}
          merge-multiple: true
      - name: Show Grafana dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file="runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.png"
          endpoint="repos/$GITHUB_REPOSITORY/contents/$file"
          base64 -w0 grafana.png | jq -Rs '{branch:"lab5-reports", message:"Dashboard", content:.}' > "$RUNNER_TEMP/image.json"
          for delay in 1 2 4; do
            if revision=$(gh api --method PUT "$endpoint" --input "$RUNNER_TEMP/image.json" --jq .commit.sha); then
              break
            fi
            sleep "$delay"
          done
          test -n "$revision"
          printf '![Результаты сценариев аутентификации](https://raw.githubusercontent.com/%s/%s/%s)\n' \
            "$GITHUB_REPOSITORY" "$revision" "$file" >> "$GITHUB_STEP_SUMMARY"
