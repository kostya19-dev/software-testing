name: Lab 3 - microbenchmarks

on:
  push:
    paths: ['lab3/**', '.github/workflows/lab3.yml']
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full 100-trial experiment'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lab3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Report dependencies
        run: python -m pip install -r requirements.txt
      - name: Correctness and statistics
        run: make test
      - name: Verify committed evidence
        run: python scripts/verify.py evidence
      - name: Docker smoke experiment
        if: ${{ !inputs.full }}
        run: make smoke
      - name: Full experiment
        if: ${{ inputs.full }}
        run: make run
      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: lab3-results-${{ github.run_id }}
          path: lab3/results/
          if-no-files-found: warn
          retention-days: 14
