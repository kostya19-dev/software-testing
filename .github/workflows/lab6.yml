name: Lab 6 - tracing and logging overhead

on:
  push:
    paths:
      - '.github/workflows/lab6.yml'
      - 'lab6/**'
      - 'project/VitaLineClinic/**'
  workflow_dispatch:
    inputs:
      scale:
        description: 'Time scale of the fixed-load scenario'
        default: '0.1'

permissions:
  contents: read

jobs:
  observability:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lab6
    env:
      API_CPUSET: '0'
      MONGO_CPUSET: '1'
      LOADGEN_CPUSET: '2'
      MONITORING_CPUSET: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: project/VitaLineClinic/go.mod
          cache-dependency-path: |
            project/VitaLineClinic/go.sum
            lab6/go.sum

      - name: Vet and unit tests
        run: make check

      - name: Build images and tools
        run: make setup

      - name: Overhead benchmarks
        run: bin/lab6 bench -count 3 -benchtime 1000x

      - name: Fixed load from k6 in every variant with traces exported from Jaeger
        run: |
          for variant in baseline tracing logging; do
            bin/lab6 run -scale "${{ inputs.scale || '0.1' }}" -variant "$variant" stable
          done

      - name: Comparison report
        if: ${{ always() }}
        run: |
          bin/lab6 compare
          if [ -f results/summary.md ]; then cat results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Trace summary
        if: ${{ always() }}
        run: |
          for summary in results/tracing/*/traces/summary.json; do
            [ -f "$summary" ] || continue
            {
              echo "### Трейсы: $(jq -r .traces "$summary") трейсов, $(jq -r .spans "$summary") спанов"
              echo
              echo "| Операция | Спанов | Среднее, мс | p95, мс |"
              echo "| --- | ---: | ---: | ---: |"
              jq -r '.operations[] | "| \(.name) | \(.spans) | \(.mean_ms * 100 | round / 100) | \(.p95_ms * 100 | round / 100) |"' "$summary"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload traces, reports and benchmarks
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lab6-${{ github.run_id }}-${{ github.run_attempt }}
          path: lab6/results/
          if-no-files-found: warn
          retention-days: 14
