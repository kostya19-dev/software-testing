version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - gocyclo
    - revive
    - misspell
    - errorlint
    - bodyclose
    - unconvert
    - nolintlint
    - gocritic
    - gosec
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
  settings:
    gocyclo:
      min-complexity: 10

formatters:
  enable:
    - gofmt
    - goimports
